name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Regenerate the vectors from qrcodegen 1.8.0
        run: |
          pip install qrcodegen==1.8.0
          python3 tools/gen-vectors.py "$RUNNER_TEMP/vectors"
          for d in "$RUNNER_TEMP"/vectors/*/; do diff -r "$d" "tests/vectors/$(basename "$d")"; done
      - run: lake build
      - run: lake test
